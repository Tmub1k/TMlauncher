name: 💡 Предложение функции (Feature Request)
description: Предложить новую функцию, платформу или визуальное улучшение.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает предложение?
      description: С какой сложностью или неудобством вы столкнулись?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как именно должна работать новая возможность?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативные варианты
      description: Рассматривали ли вы другие подходы?
