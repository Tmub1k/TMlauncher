name: 🐛 Отчёт об ошибке (Bug Report)
description: Сообщить о неполадке или некорректном поведении в OmniLauncher.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за помощь в улучшении OmniLauncher! Убедитесь, что используете последнюю версию программы.
  - type: input
    id: version
    attributes:
      label: Версия программы (Version)
      placeholder: например, v0.1.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система (OS)
      options:
        - Windows 11 (23H2 / 24H2)
        - Windows 10 (22H2)
        - Другая версия
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание проблемы (Description)
      description: Кратко и понятно опишите, что произошло.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Шаги для воспроизведения (Steps to Reproduce)
      value: |
        1. Открыть '...'
        2. Нажать на '...'
        3. Заметить ошибку
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение (Expected Behavior)
      description: Что должно было произойти вместо этого?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Чеклист
      options:
        - label: Я проверил, что подобной проблемы ещё нет в списке открытых Issues.
          required: true
        - label: Проблема повторяется на последней версии OmniLauncher.
          required: true
